name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, unit tests, build, supply chain)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile, no install scripts)
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Pack @starpi/core (typed build, dry run)
        run: npm run pack:core

      - name: Production build
        run: npm run build

      - name: Verify build output (CSP compatibility, header parity, assets, service worker, size budget)
        run: npm run verify:dist

      - name: Generated headers are current (vercel.json from scripts/headers.json)
        run: npm run headers:check

      - name: License gate (production dependencies against scripts/license-allowlist.json)
        run: npm run license:check

      - name: End-of-life register (warns 12 months ahead)
        run: npm run eol:check

      - name: Public hygiene (no private paths or internal identifiers)
        run: npm run hygiene:check

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 3
          if-no-files-found: error

  e2e:
    name: End-to-end (Playwright, production headers, cross-origin isolation, offline)
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  backend:
    name: Library publisher (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tools/library-publisher/requirements*.txt

      - name: Install dependencies (including the optional ONNX Runtime stack)
        run: python -m pip install -r tools/library-publisher/requirements-dev.txt

      - name: Lint
        run: |
          ruff check tools/library-publisher backend --no-cache
          ruff format --check tools/library-publisher backend

      - name: Byte-compile
        run: python -m compileall -q tools/library-publisher backend

      # Offline: no model download, so the test against the real model is skipped.
      - name: Unit tests (offline)
        working-directory: tools/library-publisher
        run: python -m unittest discover -v

  # The local companion (packages/companion) and its packaging. The root typecheck does not cover
  # the workspace, so it is checked here on both Node.js lines the companion supports.
  companion:
    name: Companion (Node ${{ matrix.node }}; typecheck, tests, dependency and licence checks, offline bundle)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies (lockfile, no install scripts)
        run: npm ci --ignore-scripts

      # Both scripts build @starpi/core into packages/core/dist first: the companion imports the
      # built package, and dist is not checked in.
      - name: Typecheck (builds @starpi/core first)
        run: npm run typecheck:companion

      - name: Tests (builds @starpi/core first)
        run: npm run test:companion

      - name: Dependency rules (declared packages, node prefixes, restricted modules)
        run: node scripts/companion-deps-check.mjs

      - name: Licences (npm tree of the companion, voice server requirements, voice allowlist)
        run: node scripts/companion-license-check.mjs

      # The bundle copies the published files of @starpi/core (its dist), so the build comes first.
      - name: Offline bundle and an install from its tarball into a temporary folder
        run: |
          npm run build:core
          node --test tests/unit/companion-offline-pack.test.mjs

  companion-systemd:
    name: Companion under a systemd user manager (systemd-run --user smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile, no install scripts)
        run: npm ci --ignore-scripts

      - name: Start a user manager for the runner account
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$USER"
          runtime="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            state=$(XDG_RUNTIME_DIR="$runtime" systemctl --user is-system-running 2>/dev/null || true)
            case "$state" in running|degraded) echo "user manager: $state"; exit 0 ;; esac
            sleep 1
          done
          echo "::error title=systemd::the user manager of the runner account did not start"
          exit 1

      - name: Build @starpi/core (the bundle carries its dist)
        run: npm run build:core

      - name: Build the offline bundle
        run: node scripts/companion-offline-pack.mjs --out "$RUNNER_TEMP/bundle"

      - name: Smoke test (transient unit with readiness and watchdog, then the installed user unit)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP"/bundle/starpi-companion-*.tar.gz -C "$RUNNER_TEMP/unpacked"
          bundle=$(echo "$RUNNER_TEMP"/unpacked/starpi-companion-*)
          sh "$bundle/deploy/linux/smoke.sh" "$bundle"

  voice-server:
    name: Local voice server (Python ${{ matrix.python }}, fake engines)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # The tests need the standard library only; ruff is the linter of the other Python code.
      - name: Install ruff
        run: python -m pip install ruff==0.16.10

      - name: Lint
        working-directory: companion/voice-server
        run: |
          ruff check --no-cache .
          ruff format --check --no-cache .

      - name: Byte-compile
        run: python -m compileall -q companion/voice-server

      - name: Unit tests (no models are downloaded)
        run: python -I -B -m unittest discover -s companion/voice-server -v

  database:
    name: Database migration and RLS tests (PostgreSQL 16 + pgvector)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PostgreSQL 16 and pgvector
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-16 postgresql-16-pgvector

      - name: Run migration and RLS test suite
        run: bash backend/supabase/tests/run_rls_tests.sh
        env:
          PG_BIN: /usr/lib/postgresql/16/bin

  audit:
    name: Dependency audit (npm audit, pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Runtime npm dependencies (fails on any advisory)
        run: npm audit --omit=dev --audit-level=low

      - name: Development npm dependencies (report only)
        run: |
          if ! npm audit --audit-level=high; then
            echo "::warning title=npm audit (development dependencies)::Build and test tooling has advisories of high severity; see this step's log. These packages are not shipped in dist/."
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Python dependencies (fails on any advisory)
        run: |
          python -m pip install -r backend/requirements-dev.txt
          pip-audit -r backend/requirements-dev.txt

      # Runs even when an audit step failed, so the SBOM of the failing state can be inspected.
      - name: CycloneDX SBOMs from the lockfile (npm sbom, nothing installed)
        if: ${{ !cancelled() }}
        run: npm run sbom

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom
          retention-days: 30
          if-no-files-found: error

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          set -euo pipefail
          version=8.30.1
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${sha256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan working tree
        run: "$RUNNER_TEMP/gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1"

      - name: Scan commits of this pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: '"$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="${BASE_SHA}..${HEAD_SHA}"'
