name: Release

# Publishes a GitHub release for the version in package.json once CI has passed on main, using
# docs/releases/v<version>.md as the release notes, and publishes @starpi/core and
# @starpi/companion to npm with provenance. Assets: the tarballs of both packages, the CycloneDX
# SBOMs of the app and of @starpi/core, the companion's offline bundle, SHA256SUMS over all of
# them, the Sigstore bundles of SHA256SUMS and of the offline bundle (cosign, keyless) and, when the
# secret STARPI_RELEASE_SIGNING_KEY exists, the Ed25519 signature SHA256SUMS.sig. Every asset also
# gets a build provenance attestation (gh attestation verify). Nothing happens when the release
# already exists or when there are no release notes for the version, so every green run on main is
# safe. A manual run releases the head of main once CI has passed on a push of it (the same checks
# apply), never another branch. The workflow never pushes a tag of its own: gh release create tags
# the tested commit, or keeps a tag that already points at it.
#
# The jobs keep write access and secrets away from dependency code:
#   prepare  installs from the lockfile and builds the assets, read-only, without secrets;
#   sign     runs no dependency code: attestations, cosign keyless and the Ed25519 signature
#            (scripts/sign-release.mjs, Node built-ins only), with id-token: write;
#   release  has contents: write, installs and runs nothing from the repository, checks the
#            checksums and creates the release;
#   publish  publishes the very tarballs the release carries, with provenance (id-token: write),
#            and skips a version npm already has. When it fails after the release was created,
#            re-run this job (the artifacts are kept 7 days).

on:
  # Only CI runs triggered by a push to main get past the job condition below; the checkout uses
  # the commit CI tested, and no artifact of the CI run is downloaded.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Build the release assets (read-only)
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # find the CI run of the commit for a manual run
    outputs:
      create: ${{ steps.decide.outputs.create }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Decide whether to release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          echo "create=false" >> "$GITHUB_OUTPUT"
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a version number"
            exit 1
          fi
          notes="docs/releases/v${version}.md"
          if [[ ! -f "$notes" ]]; then
            echo "No $notes: nothing to release for $version."
            exit 0
          fi
          # A draft (left by an interrupted upload) is not visible to this read-only token; the
          # release job, which can see it, stops on it.
          if [[ "$(gh release view "v${version}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)" == "false" ]]; then
            echo "Release v${version} already exists."
            exit 0
          fi
          # A manual run releases the head of main, so CI must have passed on a push of it, as it
          # has for every workflow_run.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            passed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TARGET_SHA}&event=push&status=success&per_page=1" --jq '.total_count')"
            if [[ "$passed" -lt 1 ]]; then
              echo "::error::CI has not passed on a push of ${TARGET_SHA}, the head of main; wait for it or re-run it"
              exit 1
            fi
          fi
          core_version="$(node -p "require('./packages/core/package.json').version")"
          if [[ "$core_version" != "$version" ]]; then
            echo "::error::@starpi/core is ${core_version}, the app is ${version}; both must have the same version"
            exit 1
          fi
          companion_version="$(node -p "require('./packages/companion/package.json').version")"
          companion_core="$(node -p "require('./packages/companion/package.json').dependencies['@starpi/core']")"
          if [[ "$companion_version" != "$version" || "$companion_core" != "$version" ]]; then
            echo "::error::@starpi/companion is ${companion_version} and depends on @starpi/core ${companion_core}; both must be ${version}"
            exit 1
          fi
          # A tag pushed ahead of the release must point at the commit CI tested: the assets are
          # built from that commit, and gh release create keeps an existing tag where it is.
          if ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" 2>/dev/null)"; then
            tag_type="$(jq -r '.object.type' <<<"$ref_json")"
            tag_sha="$(jq -r '.object.sha' <<<"$ref_json")"
            if [[ "$tag_type" == "tag" ]]; then
              tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object.sha')"
            fi
            if [[ "$tag_sha" != "$TARGET_SHA" ]]; then
              echo "::error::Tag v${version} points at ${tag_sha}, not at ${TARGET_SHA}, the commit CI tested. Re-run the CI run of ${tag_sha} (main must still contain it), or delete the tag to release ${TARGET_SHA}"
              exit 1
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "create=true" >> "$GITHUB_OUTPUT"

      - if: steps.decide.outputs.create == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies (lockfile, no install scripts)
        if: steps.decide.outputs.create == 'true'
        run: npm ci --ignore-scripts

      # The core first: its prepack script builds dist/, which the companion's offline bundle carries.
      - name: Pack @starpi/core and @starpi/companion and write the SBOMs
        if: steps.decide.outputs.create == 'true'
        run: |
          set -euo pipefail
          mkdir -p release-assets
          npm pack --workspace=@starpi/core --pack-destination release-assets
          npm pack --workspace=@starpi/companion --pack-destination release-assets
          npm run sbom -- --out release-assets

      # Installs the tarball built above, offline, into an empty project: no package comes from
      # the registry, so there is no lockfile to install from.
      - name: Smoke-test the package tarball
        if: steps.decide.outputs.create == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: | # zizmor: ignore[adhoc-packages]
          set -euo pipefail
          tgz="$GITHUB_WORKSPACE/release-assets/starpi-core-${VERSION}.tgz"
          listing="$(tar -tzf "$tgz")"
          for file in package/package.json package/README.md package/LICENSE package/dist/index.js package/dist/index.d.ts package/dist/verify-receipt.js package/dist/ground.js; do
            grep -qxF "$file" <<<"$listing" || { echo "::error::$file is missing from $tgz"; exit 1; }
          done
          banner="$(tar -xzOf "$tgz" package/dist/index.js | sed -n 1p)"
          [[ "$banner" == "// @starpi/core ${VERSION} (MIT)."* ]] || { echo "::error::dist/index.js was built for another version: $banner"; exit 1; }
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          echo '{ "name": "consumer", "private": true, "type": "module" }' > package.json
          # --offline: the package has no dependencies, so nothing may need the registry.
          npm install --offline --ignore-scripts --no-audit --no-fund "$tgz"
          node --input-type=module -e "
            const core = await import('@starpi/core');
            for (const name of ['groundAnswer', 'blocksFromMarkdown', 'checkDocument', 'toSarif', 'buildReceipt', 'signReceipt', 'verifyReceipt', 'verifyReceiptSignature', 'chunkText', 'BM25Index']) {
              if (typeof core[name] !== 'function') throw new Error(name + ' is not exported');
            }"
          for bin in starpi-verify-receipt starpi-ground; do
            status=0
            "node_modules/.bin/$bin" >/dev/null 2>&1 || status=$?
            [[ "$status" -eq 2 ]] || { echo "::error::$bin without arguments exited $status, expected 2"; exit 1; }
          done
          # starpi-ground finds the wrong value and writes SARIF 2.1.0.
          printf '# Plan\n\nThe approved budget is 480,000 EUR.\n' > plan.md
          printf 'The approved budget is 520,000 EUR.\n' > answer.md
          status=0
          node_modules/.bin/starpi-ground --answer answer.md --source plan.md --format sarif --output starpi.sarif || status=$?
          [[ "$status" -eq 1 ]] || { echo "::error::starpi-ground exited $status on an unsupported statement, expected 1"; exit 1; }
          node -e "
            const log = JSON.parse(require('node:fs').readFileSync('starpi.sarif', 'utf8'));
            const ids = log.runs[0].results.map((r) => r.ruleId);
            if (log.version !== '2.1.0' || ids.join() !== 'missing_fact') throw new Error('unexpected SARIF: ' + log.version + ' ' + ids);"

      - name: Check the @starpi/companion tarball
        if: steps.decide.outputs.create == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          tgz="release-assets/starpi-companion-${VERSION}.tgz"
          listing="$(tar -tzf "$tgz")"
          for file in package/package.json package/README.md package/LICENSE package/NOTICE package/bin/starpi-companion.mjs package/bin/mcp-stdio.mjs package/src/index.js; do
            grep -qxF "$file" <<<"$listing" || { echo "::error::$file is missing from $tgz"; exit 1; }
          done
          tar -xzOf "$tgz" package/package.json | VERSION="$VERSION" node -e "
            let text = '';
            process.stdin.on('data', (chunk) => (text += chunk)).on('end', () => {
              const pkg = JSON.parse(text);
              if (pkg.version !== process.env.VERSION || pkg.dependencies['@starpi/core'] !== process.env.VERSION) {
                throw new Error('the companion tarball is ' + pkg.version + ' with @starpi/core ' + pkg.dependencies['@starpi/core']);
              }
            });"

      # Deterministic: SOURCE_DATE_EPOCH is the commit time, so two builds of one commit match. The
      # bundle carries its own SHA256SUMS; its tarball is listed in the release's SHA256SUMS below.
      - name: Build the companion's offline bundle
        if: steps.decide.outputs.create == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          node scripts/companion-offline-pack.mjs --out "$RUNNER_TEMP/offline"
          cp "$RUNNER_TEMP/offline/starpi-companion-${VERSION}.tar.gz" release-assets/

      - name: Checksums
        if: steps.decide.outputs.create == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum "starpi-core-${VERSION}.tgz" "starpi-companion-${VERSION}.tgz" "starpi-${VERSION}.cdx.json" "starpi-core-${VERSION}.cdx.json" "starpi-companion-${VERSION}.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - if: steps.decide.outputs.create == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  sign:
    name: Attest and sign the release assets
    needs: prepare
    if: needs.prepare.outputs.create == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release # STARPI_RELEASE_SIGNING_KEY may be a secret of this environment
    permissions:
      contents: read
      id-token: write # Sigstore certificates for cosign and the attestations
      attestations: write # store the build provenance attestations
    steps:
      # Only for scripts/sign-release.mjs and the helper it imports: nothing is installed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Check the checksums
        working-directory: release-assets
        run: sha256sum -c SHA256SUMS

      - name: Build provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tgz
            release-assets/*.cdx.json
            release-assets/*.tar.gz

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the certificate names this workflow on main as the signer, recorded in Rekor. The
      # verify step checks exactly what users run (docs/releases notes show the same command).
      - name: Sign SHA256SUMS and the offline bundle with cosign (keyless)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
        working-directory: release-assets
        run: |
          set -euo pipefail
          for blob in SHA256SUMS "starpi-companion-${VERSION}.tar.gz"; do
            cosign sign-blob --yes --bundle "${blob}.sigstore.json" "$blob"
            cosign verify-blob --bundle "${blob}.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$blob"
          done

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Optional: without the secret the release carries the Sigstore bundles only.
      - name: Ed25519 signature of SHA256SUMS
        env:
          STARPI_RELEASE_SIGNING_KEY: ${{ secrets.STARPI_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${STARPI_RELEASE_SIGNING_KEY}" ]]; then
            echo "::notice title=Ed25519 signature::STARPI_RELEASE_SIGNING_KEY is not set; the release carries no SHA256SUMS.sig"
            exit 0
          fi
          node scripts/sign-release.mjs sign release-assets
          node scripts/sign-release.mjs public-key > "$RUNNER_TEMP/release.pub"
          node scripts/sign-release.mjs verify release-assets --key "$RUNNER_TEMP/release.pub"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signatures
          path: |
            release-assets/*.sigstore.json
            release-assets/SHA256SUMS.sig
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  release:
    name: Create the release for package.json's version
    needs: [prepare, sign]
    if: needs.prepare.outputs.create == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release and its tag, upload the assets
    steps:
      # Only for the release notes: nothing is installed or run from the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-signatures
          path: release-assets

      - name: Create the release with its assets
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a version number"
            exit 1
          fi
          (cd release-assets && sha256sum -c SHA256SUMS)
          draft="$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "$draft" == "false" ]]; then
            echo "Release v${VERSION} already exists."
            exit 0
          fi
          # gh uploads the assets to a draft and publishes it at the end; an interrupted run can
          # leave the draft behind, and it must not pass as a published release.
          if [[ "$draft" == "true" ]]; then
            echo "::error::A draft release v${VERSION} exists, probably from an interrupted upload. Delete it (gh release delete v${VERSION} --yes) and re-run this job."
            exit 1
          fi
          assets=(
            "release-assets/starpi-core-${VERSION}.tgz"
            "release-assets/starpi-companion-${VERSION}.tgz"
            "release-assets/starpi-${VERSION}.cdx.json"
            "release-assets/starpi-core-${VERSION}.cdx.json"
            "release-assets/starpi-companion-${VERSION}.tar.gz"
            release-assets/SHA256SUMS
            release-assets/SHA256SUMS.sigstore.json
            "release-assets/starpi-companion-${VERSION}.tar.gz.sigstore.json"
          )
          if [[ -f release-assets/SHA256SUMS.sig ]]; then
            assets+=(release-assets/SHA256SUMS.sig)
          fi
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Starpi v${VERSION}" \
            --notes-file "docs/releases/v${VERSION}.md" \
            --latest \
            "${assets[@]}"
          echo "Created release v${VERSION} at ${TARGET_SHA}."

  publish:
    name: Publish @starpi/core and @starpi/companion to npm (provenance)
    needs: [prepare, release]
    if: needs.prepare.outputs.create == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm # NPM_TOKEN may be a secret of this environment
    permissions:
      contents: read
      id-token: write # npm provenance, and trusted publishing where it is set up
    steps:
      # No checkout: the job publishes the tarballs the release carries, as built and checked above.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      # Node 24 brings an npm that publishes with an OIDC token (trusted publishing) when no
      # NPM_TOKEN is set; a package's first publish still needs the token.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish (the core first, the companion depends on it)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        # NPM_TOKEN covers a package's first publish, before npm lets trusted publishing be set up.
        run: | # zizmor: ignore[use-trusted-publishing]
          set -euo pipefail
          (cd release-assets && sha256sum -c SHA256SUMS)
          for pkg in core companion; do
            if npm view "@starpi/${pkg}@${VERSION}" version >/dev/null 2>&1; then
              echo "@starpi/${pkg}@${VERSION} is on npm already."
              continue
            fi
            npm publish "release-assets/starpi-${pkg}-${VERSION}.tgz" --provenance --access public
          done
