name: Model lock

# Compares src/js/models/model-lock.json with the model hosts once a week. A failure means an upstream file
# changed or a catalog entry has no pinned hash yet: run `npm run models:lock` locally and review the diff.
on:
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

permissions: {}

concurrency:
  group: model-lock
  cancel-in-progress: false

jobs:
  check:
    name: Check the model lock against the hosts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile, no install scripts)
        run: npm ci --ignore-scripts

      - name: Compare the lock with the hosts
        run: npm run models:lock -- --check
