<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Starpi: local-first RAG with verifiable citations</title>
  <desc id="d">A file is dropped, parsed and chunked in an ingestion worker, indexed with BM25 in worker memory, answered by WebLLM on WebGPU in its own worker, and every citation opens the exact span it came from. Files never leave the device.</desc>
  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .h { fill: #fafafa; font-size: 15px; font-weight: 600; }
    .sub { fill: #a3a3a3; font-size: 12px; }
    .step { fill: #737373; font-size: 11px; letter-spacing: .08em; }
    .muted { fill: #737373; font-size: 12px; }
    .node { fill: #111111; stroke: #262626; stroke-width: 1; }
    .icon { fill: none; stroke: #737373; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .wire { stroke: #3f3f46; stroke-width: 1.5; stroke-dasharray: 4 6; animation: flow 1s linear infinite; }
    .lit { fill: none; stroke: #facc15; stroke-width: 1.5; opacity: 0; animation: lit 6s ease-in-out infinite backwards; }
    .lit5 { animation-name: lit-last; }
    .packet { fill: #facc15; opacity: 0; animation: hop 6s ease-in-out infinite backwards; }
    .badge { opacity: 1; animation: rise .6s ease-out 1 backwards; }
    .badge rect { fill: #052e16; stroke: #14532d; }
    .badge text { fill: #bbf7d0; font-size: 12px; }
    .badge circle { fill: #22c55e; }
    .chip rect { fill: #422006; stroke: #a16207; }
    .chip text { fill: #fde68a; font-size: 12px; }
    .glow { fill: none; stroke: #facc15; stroke-width: 2; opacity: 0; animation: glow 6s ease-in-out infinite backwards; animation-delay: 4.5s; }
    .mark { fill: #facc15; opacity: .28; transform-box: fill-box; transform-origin: left center; animation: sweep 6s ease-in-out infinite backwards; animation-delay: 4.5s; }
    .live { fill: #22c55e; animation: pulse 2s ease-in-out infinite; }
    .drop { animation: drop 6s ease-out infinite backwards; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @keyframes lit { 0% { opacity: 0; } 3% { opacity: 1; } 14% { opacity: 1; } 19% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes lit-last { 0% { opacity: 0; } 3% { opacity: 1; } 22% { opacity: 1; } 26% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes hop { 0% { opacity: 0; transform: translateX(0); } 1% { opacity: 1; } 7% { opacity: 1; transform: translateX(28px); } 8% { opacity: 0; transform: translateX(28px); } 100% { opacity: 0; transform: translateX(28px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes glow { 0% { opacity: 0; } 4% { opacity: 1; } 18% { opacity: 1; } 24% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes sweep { 0% { transform: scaleX(0); } 12% { transform: scaleX(1); } 22% { transform: scaleX(1); opacity: .28; } 26% { opacity: 0; transform: scaleX(1); } 100% { opacity: 0; transform: scaleX(1); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes drop { 0% { transform: translateY(-8px); opacity: 0; } 5% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .wire, .lit, .packet, .badge, .glow, .mark, .live, .drop { animation: none; }
      .lit5, .glow { opacity: 1; }
      .mark { opacity: .28; }
    }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1c1c1c"/>
    </pattern>
  </defs>

  <rect x="8" y="8" width="1184" height="404" rx="18" fill="#0a0a0a" stroke="#262626"/>
  <rect x="8" y="8" width="1184" height="404" rx="18" fill="url(#dots)"/>

  <g class="sans">
    <path d="M52 34 l3.2 7.3 7.3 3.2 -7.3 3.2 -3.2 7.3 -3.2 -7.3 -7.3 -3.2 7.3 -3.2z" fill="#facc15"/>
    <text x="68" y="50"><tspan class="h" style="font-size:17px">Starpi</tspan><tspan class="sub" dx="12" style="font-size:14px">local-first RAG with verifiable citations</tspan></text>
    <circle cx="1040" cy="45" r="4" class="live"/>
    <text x="1052" y="49" class="mono muted">www.starpi.app</text>
  </g>

  <g class="wires">
    <line x1="232" y1="154" x2="272" y2="154" class="wire"/>
    <line x1="464" y1="154" x2="504" y2="154" class="wire"/>
    <line x1="696" y1="154" x2="736" y2="154" class="wire"/>
    <line x1="928" y1="154" x2="968" y2="154" class="wire"/>
  </g>

  <g class="sans">
    <rect x="40" y="84" width="192" height="140" rx="12" class="node"/>
    <rect x="40" y="84" width="192" height="140" rx="12" class="lit" style="animation-delay:0s"/>
    <g class="drop"><path class="icon" d="M202 100 h9 l6 6 v15 h-15z M211 100 v6 h6"/></g>
    <text x="56" y="112" class="step mono">01</text>
    <text x="56" y="142" class="h">Drop files</text>
    <text x="56" y="166" class="sub">PDF · MD · JSON · CSV</text>
    <text x="56" y="186" class="sub">parsed on this device</text>

    <rect x="272" y="84" width="192" height="140" rx="12" class="node"/>
    <rect x="272" y="84" width="192" height="140" rx="12" class="lit" style="animation-delay:1.1s"/>
    <path class="icon" d="M432 102 h14 v14 h-14z M436 99 v3 M442 99 v3 M436 116 v3 M442 116 v3 M429 106 h3 M429 112 h3 M446 106 h3 M446 112 h3"/>
    <text x="288" y="112" class="step mono">02</text>
    <text x="288" y="142" class="h">Ingestion worker</text>
    <text x="288" y="166" class="sub">pdf.js 6, no eval</text>
    <text x="288" y="186" class="sub">off the main thread</text>

    <rect x="504" y="84" width="192" height="140" rx="12" class="node"/>
    <rect x="504" y="84" width="192" height="140" rx="12" class="lit" style="animation-delay:2.3s"/>
    <path class="icon" d="M664 120 v-6 M670 120 v-14 M676 120 v-10 M682 120 v-18"/>
    <text x="520" y="112" class="step mono">03</text>
    <text x="520" y="142" class="h">BM25 index</text>
    <text x="520" y="166" class="sub">500-char chunks, exact</text>
    <text x="520" y="186" class="sub">offsets, in worker memory</text>

    <rect x="736" y="84" width="192" height="140" rx="12" class="node"/>
    <rect x="736" y="84" width="192" height="140" rx="12" class="lit" style="animation-delay:3.4s"/>
    <path class="icon" d="M894 100 h18 v18 h-18z M900 106 h6 v6 h-6z"/>
    <text x="752" y="112" class="step mono">04</text>
    <text x="752" y="142" class="h">WebGPU inference</text>
    <text x="752" y="166" class="sub">WebLLM in its own worker</text>
    <text x="752" y="186" class="sub">or your own server</text>

    <rect x="968" y="84" width="192" height="140" rx="12" class="node"/>
    <rect x="968" y="84" width="192" height="140" rx="12" class="lit lit5" style="animation-delay:4.5s"/>
    <path class="icon" d="M1129 100 h14 v19 l-7 -5 -7 5z"/>
    <text x="984" y="112" class="step mono">05</text>
    <text x="984" y="142" class="h">Citation drawer</text>
    <text x="984" y="166" class="mono" style="fill:#fde68a;font-size:10.5px">[Doc: plan.pdf, Chunk: 1]</text>
    <text x="984" y="186" class="sub">opens the exact span</text>
  </g>

  <g>
    <circle cx="236" cy="154" r="4" class="packet" style="animation-delay:0.6s"/>
    <circle cx="468" cy="154" r="4" class="packet" style="animation-delay:1.9s"/>
    <circle cx="700" cy="154" r="4" class="packet" style="animation-delay:3.0s"/>
    <circle cx="932" cy="154" r="4" class="packet" style="animation-delay:4.1s"/>
  </g>

  <g class="sans">
    <rect x="40" y="244" width="1120" height="76" rx="12" class="node"/>
    <text x="60" y="275" class="mono step">ANSWER</text>
    <text x="150" y="275" style="fill:#e5e5e5;font-size:14px">The approved budget for Project Nebula is 480000 EUR</text>
    <g class="chip">
      <rect x="560" y="259" width="210" height="24" rx="12"/>
      <text x="665" y="275" class="mono" text-anchor="middle">[Doc: plan.pdf, Chunk: 1]</text>
    </g>
    <rect x="557" y="256" width="216" height="30" rx="15" class="glow"/>
    <text x="60" y="304" class="mono step">SOURCE</text>
    <text x="150" y="304" class="mono muted">plan.pdf · chunk 1 ·</text>
    <rect x="304" y="291" width="420" height="18" rx="3" class="mark"/>
    <text x="308" y="304" class="mono" style="fill:#d4d4d4;font-size:12px">The approved budget for Project Nebula is 480000 EUR.</text>
  </g>

  <g class="sans">
    <g class="badge" style="animation-delay:.4s">
      <rect x="151" y="340" width="214" height="28" rx="14"/>
      <circle cx="169" cy="354" r="4"/>
      <text x="181" y="358">Files never leave the device</text>
    </g>
    <g class="badge" style="animation-delay:.8s">
      <rect x="379" y="340" width="164" height="28" rx="14"/>
      <circle cx="397" cy="354" r="4"/>
      <text x="409" y="358">Verifiable citations</text>
    </g>
    <g class="badge" style="animation-delay:1.2s">
      <rect x="557" y="340" width="208" height="28" rx="14"/>
      <circle cx="575" cy="354" r="4"/>
      <text x="587" y="358">Strict CSP · no unsafe-eval</text>
    </g>
    <g class="badge" style="animation-delay:1.6s">
      <rect x="779" y="340" width="270" height="28" rx="14"/>
      <circle cx="797" cy="354" r="4"/>
      <text x="809" y="358">On-device mode: question stays local</text>
    </g>
  </g>
</svg>
