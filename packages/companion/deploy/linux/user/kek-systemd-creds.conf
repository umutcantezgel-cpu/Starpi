# Drop-in for starpi-companion.service (user): the vault's key-encryption key as an encrypted
# systemd credential (KEK provider systemd-creds; user credentials need systemd 256 or newer).
# install.sh --kek systemd-creds writes it to
#   ~/.config/systemd/user/starpi-companion.service.d/kek.conf
# with @CREDENTIAL@ replaced, after `starpi-companion kek-init` made the credential with
# `systemd-creds --user encrypt`. systemd decrypts it into the service's private credentials
# folder, where the companion reads it as starpi-companion-kek; the key never lies in plain text
# on disk. The credential is bound to this machine (and its TPM2 where present), and backups never
# hold the key: to move notes, chats and secrets to another machine, use `starpi-companion export`
# (a passphrase-sealed bundle) and `import` there.

[Service]
LoadCredentialEncrypted=starpi-companion-kek:@CREDENTIAL@
