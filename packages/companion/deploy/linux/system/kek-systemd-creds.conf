# Drop-in for starpi-companion.service (system): the vault's key-encryption key as an encrypted
# systemd credential (KEK provider systemd-creds, systemd 250 or newer). install.sh --system
# --kek systemd-creds writes it to /etc/systemd/system/starpi-companion.service.d/kek.conf after
# `starpi-companion kek-init` made /etc/credstore.encrypted/starpi-companion-kek with
# `systemd-creds encrypt` (bound to this machine's host key and its TPM2 where present). systemd
# decrypts it into the service's private credentials folder; the egress splice cannot see it.
# Backups never hold the key: move data to another machine with `starpi-companion export`.

[Service]
LoadCredentialEncrypted=starpi-companion-kek:@CREDENTIAL@
