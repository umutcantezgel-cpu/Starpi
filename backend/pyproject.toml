# Tooling configuration for the Python helper in backend/ (supabase/apply_migration.py). The
# library publisher in tools/library-publisher has its own configuration.

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "S",  # flake8-bandit
]
